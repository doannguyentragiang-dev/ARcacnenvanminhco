<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Di Sản: Vương Quốc Champa</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

  <script>
    // --- BỘ XỬ LÝ AR (GIỮ NGUYÊN) ---
    AFRAME.registerComponent('ar-controller', {
      init: function () {
        this.el.addEventListener("arError", (ev) => {
          alert("Lỗi Camera. Vui lòng chạy trên HTTPS hoặc Localhost!");
        });
      }
    });

    AFRAME.registerComponent('gesture-handler', {
      schema: { enabled: { default: true }, rotationFactor: { default: 5 }, minScale: { default: 0.1 }, maxScale: { default: 8 } },
      init: function () {
        this.handleScale = this.handleScale.bind(this);
        this.handleRotation = this.handleRotation.bind(this);
        this.isVisible = false;
        this.initialScale = this.el.object3D.scale.clone();
        this.scaleFactor = 1;
        this.el.sceneEl.addEventListener("markerFound", (e) => { this.isVisible = true; });
        this.el.sceneEl.addEventListener("markerLost", (e) => { this.isVisible = false; });
      },
      update: function () {
        this.el.sceneEl.addEventListener("onefingermove", this.handleRotation);
        this.el.sceneEl.addEventListener("twofingermove", this.handleScale);
      },
      handleRotation: function (event) {
        if (this.isVisible) {
          this.el.object3D.rotation.y += event.detail.positionChange.x * this.data.rotationFactor;
        }
      },
      handleScale: function (event) {
        if (this.isVisible) {
          this.scaleFactor *= (1 + event.detail.spreadChange / event.detail.startSpread);
          this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);
          this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
          this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
          this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
        }
      }
    });

    AFRAME.registerComponent('gesture-detector', {
      init: function () {
        this.el.addEventListener('mousedown', (event) => { this.el.emit('rangeStart', event); });
        this.el.addEventListener('mousemove', (event) => { this.el.emit('onefingermove', { positionChange: { x: event.movementX / 100, y: event.movementY / 100 } }); });
        this.el.addEventListener('touchstart', (event) => { 
            if(event.touches.length === 2) {
                this.startSpread = Math.hypot(event.touches[0].pageX - event.touches[1].pageX, event.touches[0].pageY - event.touches[1].pageY);
            }
            if(event.touches.length === 1) this.lastX = event.touches[0].clientX;
        });
        this.el.addEventListener('touchmove', (event) => { 
           if (event.touches.length === 1) {
              const touch = event.touches[0];
              const movementX = touch.clientX - (this.lastX || touch.clientX);
              this.lastX = touch.clientX;
              this.el.emit('onefingermove', { positionChange: { x: movementX / 100, y: 0 } });
           }
           if (event.touches.length === 2) {
               const spread = Math.hypot(event.touches[0].pageX - event.touches[1].pageX, event.touches[0].pageY - event.touches[1].pageY);
               const spreadChange = spread - this.startSpread;
               this.el.emit('twofingermove', { spreadChange: spreadChange, startSpread: this.startSpread });
               this.startSpread = spread;
           }
        });
      }
    });

    AFRAME.registerComponent('blue-chromakey', {
      schema: {
        src: {type: 'selector'},
        color: {type: 'vec3', default: {x: 0.0, y: 1.0, z: 0.0}},
        similarity: {default: 0.25, type: 'number'}
      },
      init: function() {
        const videoEl = this.data.src;
        if (!videoEl) return;
        this.videoEl = videoEl;
        this.texture = new THREE.VideoTexture(videoEl);
        this.texture.minFilter = THREE.LinearFilter;
        this.texture.format = THREE.RGBAFormat;
        this.material = new THREE.ShaderMaterial({
          uniforms: {
            map: { value: this.texture },
            keyColor: { value: new THREE.Vector3(this.data.color.x, this.data.color.y, this.data.color.z) },
            similarity: { value: this.data.similarity },
            smoothness: { value: 0.08 },
            cropMargin: { value: 0.02 }
          },
          vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
          fragmentShader: `
            uniform sampler2D map; uniform vec3 keyColor; uniform float similarity; uniform float smoothness; uniform float cropMargin; varying vec2 vUv;
            void main() {
              if (vUv.y < cropMargin || vUv.y > (1.0 - cropMargin) || vUv.x < cropMargin || vUv.x > (1.0 - cropMargin)) { gl_FragColor = vec4(0.0); return; }
              vec4 texColor = texture2D(map, vUv);
              float d = distance(texColor.rgb, keyColor);
              float alpha = smoothstep(similarity, similarity + smoothness, d);
              gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
            }
          `,
          transparent: true, side: THREE.DoubleSide, depthTest: false
        });
        this.el.getObject3D('mesh').material = this.material;
      },
      tick: function() { 
        if (!this.el.object3D.visible) return; // CHỐNG LAG
        if (this.texture) this.texture.needsUpdate = true; 
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
    #start-btn { padding: 15px 50px; font-size: 24px; font-weight: bold; background: #FF4500; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 69, 0, 0.6); margin-top: 20px;}
    .ui-btn { position: fixed; width: 50px; height: 50px; background: white; border-radius: 50%; border: 3px solid #8B4513; color: #8B4513; font-size: 24px; font-weight: bold; z-index: 1000; cursor: pointer; display: none; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #info-btn { top: 20px; right: 20px; }
    #mute-btn { top: 80px; right: 20px; font-size: 20px; }
    #info-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10001; justify-content: center; align-items: center; flex-direction: column; }
    #info-content { max-width: 95%; max-height: 85%; border-radius: 10px; border: 2px solid white; object-fit: contain; }
  </style>
</head>

<body>
  <div id="start-screen">
      <div style="font-size: 14px; color: #ccc;">Đang tải dữ liệu Champa...</div>
      <button id="start-btn">SẴN SÀNG</button>
  </div>
  
  <div id="info-btn" class="ui-btn">i</div>
  <div id="mute-btn" class="ui-btn">🔇</div>
  
  <div id="info-modal">
    <img id="info-content" src="" alt="Thông tin">
    <div style="color:white; margin-top:10px">(Chạm để đóng)</div>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; maxTrack: 1; filterMinCF:0.001; filterBeta: 10;" 
           color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
           gesture-detector ar-controller> 
    
    <a-assets>
        <video id="v-champa1" src="./champa1.mp4" crossorigin loop playsinline muted preload="none"></video>
        <video id="v-champa2" src="./champa2.mp4" crossorigin loop playsinline muted preload="none"></video>
        <video id="v-champa3" src="./champa4.mp4" crossorigin loop playsinline muted preload="none"></video> <video id="v-champa4" src="./champa4.mp4" crossorigin loop playsinline muted preload="none"></video>
        <video id="v-champa5" src="./champa5.mp4" crossorigin loop playsinline muted preload="none"></video>
        
        <a-asset-item id="m-champa6" src="./champa6.glb"></a-asset-item>
        <a-asset-item id="m-champa7" src="./champa7.glb"></a-asset-item>
        <a-asset-item id="m-champa9" src="./champa9.glb"></a-asset-item>
        <a-asset-item id="m-champa11" src="./champa11.glb"></a-asset-item>
        <a-asset-item id="m-champa12" src="./champa12.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="targets-container"></a-entity>

  </a-scene>

  <script>
    // --- DANH SÁCH THẺ CHAMPA (0-12) ---
    const config = [
        {t:'video', src:'#v-champa1'}, // Index 0 (Thẻ 1)
        {t:'video', src:'#v-champa2'}, // Index 1
        {t:'video', src:'#v-champa3'}, // Index 2
        {t:'video', src:'#v-champa4'}, // Index 3
        {t:'video', src:'#v-champa5'}, // Index 4
        {t:'model', src:'#m-champa6'}, // Index 5
        {t:'model', src:'#m-champa7'}, // Index 6
        {t:'missing'},                  // Index 7 (Thẻ 8 - thiếu)
        {t:'model', src:'#m-champa9'}, // Index 8
        {t:'image', src:'./champa10a.png'}, // Index 9
        {t:'model', src:'#m-champa11'}, // Index 10
        {t:'model', src:'#m-champa12'}, // Index 11
        {t:'image', src:'./champa13a.png'} // Index 12
    ];

    const container = document.getElementById('targets-container');

    // Tự động tạo thẻ HTML
    config.forEach((item, index) => {
        const entity = document.createElement('a-entity');
        entity.setAttribute('mindar-image-target', `targetIndex: ${index}`);
        entity.setAttribute('id', `target-${index}`);

        if (item.t === 'video') {
            const plane = document.createElement('a-plane');
            plane.setAttribute('position', '0 0 0');
            plane.setAttribute('height', '2');
            plane.setAttribute('width', '1.2');
            plane.setAttribute('blue-chromakey', `src: ${item.src}; color: 0 1 0`); // Champa auto xanh lá
            entity.appendChild(plane);
        } 
        else if (item.t === 'model') {
            const model = document.createElement('a-entity');
            model.setAttribute('gltf-model', item.src);
            model.setAttribute('rotation', '90 0 0');
            model.setAttribute('scale', '1 1 1');
            model.setAttribute('gesture-handler', '');
            model.setAttribute('animation-mixer', '');
            entity.appendChild(model);
        }
        else if (item.t === 'image') {
            const img = document.createElement('a-plane');
            img.setAttribute('src', item.src);
            img.setAttribute('rotation', '0 0 0');
            img.setAttribute('height', '1.5');
            img.setAttribute('width', '1');
            entity.appendChild(img);
        }
        else if (item.t === 'missing') {
            const text = document.createElement('a-text');
            text.setAttribute('value', 'Sắp hoàn thiện');
            text.setAttribute('align', 'center');
            text.setAttribute('color', 'white');
            text.setAttribute('scale', '2 2 2');
            entity.appendChild(text);
        }
        container.appendChild(entity);
    });

    // --- LOGIC ĐIỀU KHIỂN ---
    let currentTargetIndex = -1;
    let isMuted = true;

    const startScreen = document.getElementById('start-screen');
    const infoBtn = document.getElementById('info-btn');
    const muteBtn = document.getElementById('mute-btn');
    const infoModal = document.getElementById('info-modal');

    function stopAllMedia() {
        document.querySelectorAll('video').forEach(m => {
            m.pause();
            m.currentTime = 0;
        });
    }

    document.getElementById('start-btn').addEventListener('click', () => {
        startScreen.style.display = 'none';
        document.querySelectorAll('video').forEach(m => {
            m.muted = true;
            // Kích hoạt video engine nhưng không play
            m.play().then(() => { m.pause(); m.currentTime = 0; }).catch(()=>{});
        });
    });

    muteBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        muteBtn.innerText = isMuted ? '🔇' : '🔊';
        document.querySelectorAll('video').forEach(m => m.muted = isMuted);
    });

    config.forEach((item, index) => {
        const el = document.getElementById(`target-${index}`);
        
        el.addEventListener('targetFound', () => {
            stopAllMedia(); // Dừng thẻ cũ
            currentTargetIndex = index;
            infoBtn.style.display = 'flex';
            muteBtn.style.display = 'flex';

            if (item.t === 'video') {
                const v = document.querySelector(item.src);
                if(v) { 
                    v.currentTime = 0; 
                    v.muted = isMuted;
                    v.play().catch(e => console.log("Play error:", e)); 
                }
            }
        });

        el.addEventListener('targetLost', () => {
            infoBtn.style.display = 'none';
            muteBtn.style.display = 'none';
            if (item.t === 'video') {
                const v = document.querySelector(item.src);
                if(v) v.pause();
            }
        });
    });

    infoBtn.addEventListener('click', () => {
        document.getElementById('info-content').src = './thongtin.png';
        infoModal.style.display = 'flex';
        document.querySelectorAll('video').forEach(v => v.pause());
    });

    infoModal.addEventListener('click', () => {
        infoModal.style.display = 'none';
        if(currentTargetIndex !== -1) {
            const item = config[currentTargetIndex];
            if(item.t === 'video') document.querySelector(item.src).play();
        }
    });
  </script>
</body>
</html>
