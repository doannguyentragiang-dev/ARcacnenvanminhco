<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR Văn Lang</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

<script>
// ==== CHROMAKEY TỐI ƯU ====
AFRAME.registerComponent('blue-chromakey', {
schema: {
src: {type: 'selector'},
color: {type: 'vec3', default: {x:0,y:1,z:0}},
similarity: {default:0.25},
crop:{default:0.02}
},
init:function(){
const video=this.data.src;
if(!video)return;

this.texture=new THREE.VideoTexture(video);
this.texture.minFilter=THREE.LinearFilter;
this.texture.format=THREE.RGBAFormat;

this.material=new THREE.ShaderMaterial({
uniforms:{
map:{value:this.texture},
keyColor:{value:new THREE.Vector3(this.data.color.x,this.data.color.y,this.data.color.z)},
similarity:{value:this.data.similarity},
smoothness:{value:0.08},
cropMargin:{value:this.data.crop}
},
vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
fragmentShader:`
uniform sampler2D map;
uniform vec3 keyColor;
uniform float similarity;
uniform float smoothness;
uniform float cropMargin;
varying vec2 vUv;
void main(){
if(vUv.x<cropMargin||vUv.x>1.0-cropMargin||vUv.y<cropMargin||vUv.y>1.0-cropMargin){discard;}
vec4 tex=texture2D(map,vUv);
float d=distance(tex.rgb,keyColor);
float alpha=smoothstep(similarity,similarity+smoothness,d);
gl_FragColor=vec4(tex.rgb,tex.a*alpha);
}
`,
transparent:true
});
this.el.getObject3D('mesh').material=this.material;
},
tick:function(){
if(!this.texture)return;
const video=this.data.src;
if(video&&!video.paused&&this.el.object3D.visible){
this.texture.needsUpdate=true;
}
}
});
</script>

<style>
body{margin:0;overflow:hidden;}
.ui-btn{
position:fixed;
right:20px;
width:50px;height:50px;
background:white;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
z-index:9999;
cursor:pointer;
display:none;
}
#info-btn{top:20px}
#audio-btn{top:80px}
#toggle-video-btn{top:140px}
</style>
</head>

<body>

<div id="info-btn" class="ui-btn">i</div>
<div id="audio-btn" class="ui-btn">🔊</div>
<div id="toggle-video-btn" class="ui-btn">🎬</div>

<a-scene
mindar-image="imageTargetSrc: ./targets.mind; uiScanning:no;"
renderer="colorManagement:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-assets timeout="10000">

<!-- VIDEO preload nhẹ -->
<video id="v-vanlang2" src="./vanlang2.mp4" playsinline loop preload="metadata" muted></video>
<video id="v-vanlang6" src="./vanlang6.mp4" playsinline loop preload="metadata" muted></video>

<!-- MODELS -->
<a-asset-item id="m-vanlang2" src="./vanlang2.glb"></a-asset-item>
<a-asset-item id="m-vanlang3" src="./vanlang3.glb"></a-asset-item>
<a-asset-item id="m-vanlang6" src="./vanlang6.glb"></a-asset-item>

<!-- AUDIO -->
<audio id="a-vanlang2" src="./vanlang2.mp3" preload="metadata"></audio>
<audio id="a-vanlang3" src="./vanlang3.mp3" preload="metadata"></audio>
<audio id="a-vanlang6" src="./vanlang6.mp3" preload="metadata"></audio>

</a-assets>

<a-camera position="0 0 0"></a-camera>

<!-- THẺ 2 -->
<a-entity id="t1" mindar-image-target="targetIndex:1">
<a-entity id="model-t1" gltf-model="#m-vanlang2" rotation="90 0 0" visible="false"></a-entity>
<a-plane id="video-t1" height="2" width="1.2"
blue-chromakey="src:#v-vanlang2; color:0.09 0 0.68"></a-plane>
</a-entity>

<!-- THẺ 3 -->
<a-entity id="t2" mindar-image-target="targetIndex:2">
<a-entity id="model-t2" gltf-model="#m-vanlang3" rotation="90 0 0" visible="false"></a-entity>
<a-plane id="video-t2" height="2" width="1.2"
blue-chromakey="src:#v-vanlang2; color:0 1 0"></a-plane>
</a-entity>

<!-- THẺ 6 -->
<a-entity id="t5" mindar-image-target="targetIndex:5">
<a-entity id="model-t5" gltf-model="#m-vanlang6" rotation="90 0 0" visible="false"></a-entity>
<a-plane id="video-t5" height="2" width="1.2"
blue-chromakey="src:#v-vanlang6; color:0 1 0"></a-plane>
</a-entity>

</a-scene>

<script>

let currentIdx=-1;
let isVideoMode=true;
let currentVideo=null;
let isAudio=false;

const infoBtn=document.getElementById("info-btn");
const audioBtn=document.getElementById("audio-btn");
const toggleBtn=document.getElementById("toggle-video-btn");

function stopCurrent(){
if(currentVideo){currentVideo.pause();currentVideo.currentTime=0;}
if(currentIdx!=-1){
const a=document.getElementById(`a-vanlang${currentIdx+1}`);
if(a)a.pause();
}
}

for(let i of [1,2,5]){
const entity=document.getElementById(`t${i}`);
entity.addEventListener("targetFound",()=>{
stopCurrent();
currentIdx=i;
infoBtn.style.display="flex";
audioBtn.style.display="flex";
toggleBtn.style.display="flex";

const vidId=(i===5)?"v-vanlang6":"v-vanlang2";
const vid=document.getElementById(vidId);
currentVideo=vid;
vid.currentTime=0;
vid.muted=isAudio;
vid.play();
isVideoMode=true;
});
entity.addEventListener("targetLost",()=>{
stopCurrent();
infoBtn.style.display="none";
audioBtn.style.display="none";
toggleBtn.style.display="none";
currentIdx=-1;
});
}

// CHUYỂN VIDEO <-> MODEL
toggleBtn.addEventListener("click",()=>{
if(currentIdx==-1)return;

const model=document.getElementById(`model-t${currentIdx}`);
const plane=document.getElementById(`video-t${currentIdx}`);
const vid=currentVideo;

if(isVideoMode){
plane.setAttribute("visible","false");
model.setAttribute("visible","true");
vid.pause();
}else{
model.setAttribute("visible","false");
plane.setAttribute("visible","true");
vid.currentTime=0;
vid.play();
}
isVideoMode=!isVideoMode;
});

// AUDIO
audioBtn.addEventListener("click",()=>{
if(currentIdx==-1)return;
isAudio=!isAudio;
audioBtn.innerText=isAudio?"🎵":"🔊";

const audio=document.getElementById(`a-vanlang${currentIdx+1}`);
if(isAudio){
if(audio)audio.play();
if(currentVideo)currentVideo.muted=true;
}else{
if(audio)audio.pause();
if(currentVideo)currentVideo.muted=false;
}
});

</script>

</body>
</html>
