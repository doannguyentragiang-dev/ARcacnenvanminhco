<script>
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("LOI CAMERA: Vui long chay tren HTTPS");
}

AFRAME.registerComponent('gesture-handler', {
schema: { enabled: { default: true }, rotationFactor: { default: 5 }, minScale: { default: 0.1 }, maxScale: { default: 8 } },
init: function () {
this.handleScale = this.handleScale.bind(this);
this.handleRotation = this.handleRotation.bind(this);
this.isVisible = false;
this.initialScale = this.el.object3D.scale.clone();
this.scaleFactor = 1;
this.el.sceneEl.addEventListener("markerFound", (e) => { this.isVisible = true; });
this.el.sceneEl.addEventListener("markerLost", (e) => { this.isVisible = false; });
},
update: function () {
this.el.sceneEl.addEventListener("onefingermove", this.handleRotation);
this.el.sceneEl.addEventListener("twofingermove", this.handleScale);
},
handleRotation: function (event) {
if (this.isVisible) {
this.el.object3D.rotation.y += event.detail.positionChange.x * this.data.rotationFactor;
}
},
handleScale: function (event) {
if (this.isVisible) {
this.scaleFactor *= (1 + event.detail.spreadChange / event.detail.startSpread);
this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);
this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
}
}
});

AFRAME.registerComponent('gesture-detector', {
init: function () {
this.el.addEventListener('mousedown', (event) => { this.el.emit('rangeStart', event); });
this.el.addEventListener('mousemove', (event) => { this.el.emit('onefingermove', { positionChange: { x: event.movementX / 100, y: event.movementY / 100 } }); });
this.el.addEventListener('touchstart', (event) => {
if(event.touches.length === 2) {
this.startSpread = Math.hypot(event.touches[0].pageX - event.touches[1].pageX, event.touches[0].pageY - event.touches[1].pageY);
}
if(event.touches.length === 1) this.lastX = event.touches[0].clientX;
});
this.el.addEventListener('touchmove', (event) => {
if (event.touches.length === 1) {
const touch = event.touches[0];
const movementX = touch.clientX - (this.lastX || touch.clientX);
this.lastX = touch.clientX;
this.el.emit('onefingermove', { positionChange: { x: movementX / 100, y: 0 } });
}
if (event.touches.length === 2) {
const spread = Math.hypot(event.touches[0].pageX - event.touches[1].pageX, event.touches[0].pageY - event.touches[1].pageY);
const spreadChange = spread - this.startSpread;
this.el.emit('twofingermove', { spreadChange: spreadChange, startSpread: this.startSpread });
this.startSpread = spread;
}
});
}
});

AFRAME.registerComponent('blue-chromakey', {
schema: {
src: {type: 'selector'},
color: {type: 'vec3', default: {x: 0.0, y: 1.0, z: 0.0}}, 
similarity: {default: 0.25, type: 'number'},
crop: {default: 0.02, type: 'number'}
},
init: function() {
const videoEl = this.data.src;
if (!videoEl) return;
this.videoEl = videoEl;
this.texture = new THREE.VideoTexture(videoEl);
this.texture.minFilter = THREE.LinearFilter;
this.texture.format = THREE.RGBAFormat;
this.material = new THREE.ShaderMaterial({
uniforms: {
map: { value: this.texture },
keyColor: { value: new THREE.Vector3(this.data.color.x, this.data.color.y, this.data.color.z) },
similarity: { value: this.data.similarity },
smoothness: { value: 0.08 },
cropMargin: { value: this.data.crop } 
},
vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
fragmentShader: `
uniform sampler2D map; uniform vec3 keyColor; uniform float similarity; uniform float smoothness; uniform float cropMargin; varying vec2 vUv;
void main() {
if (vUv.y < cropMargin || vUv.y > (1.0 - cropMargin) || vUv.x < cropMargin || vUv.x > (1.0 - cropMargin)) { gl_FragColor = vec4(0.0); return; }
vec4 texColor = texture2D(map, vUv);
float d = distance(texColor.rgb, keyColor);
float alpha = smoothstep(similarity, similarity + smoothness, d);
gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
}
`,
transparent: true, side: THREE.DoubleSide, depthTest: false
});
this.el.getObject3D('mesh').material = this.material;
},
tick: function() { 
let isVisible = this.el.object3D.visible;
let parentVisible = this.el.object3D.parent ? this.el.object3D.parent.visible : true;
if (!isVisible || !parentVisible) return; 

if (!this.videoEl || this.videoEl.paused || this.videoEl.readyState < 2) return;
if (this.texture) this.texture.needsUpdate = true; 
}
});
</script>

<style>
body { margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; }
#start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
#start-btn { padding: 15px 50px; font-size: 24px; font-weight: bold; background: #FF4500; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 69, 0, 0.6); margin-top: 20px;}

.ui-btn { position: fixed; width: 50px; height: 50px; background: white; border-radius: 50%; border: 3px solid #8B4513; color: #8B4513; font-size: 24px; font-weight: bold; z-index: 1000; cursor: pointer; display: none; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
#info-btn { top: 20px; right: 20px; }
#audio-btn { top: 80px; right: 20px; font-size: 20px;}
#toggle-video-btn { top: 140px; right: 20px; font-size: 20px; background: #e3f2fd; } 

#info-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10001; justify-content: center; align-items: center; flex-direction: column; }
#info-content { max-width: 95%; max-height: 85%; border-radius: 10px; border: 2px solid white; object-fit: contain; }

.menu-overlay { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; z-index: 2000; flex-direction: column; align-items: center; gap: 15px; }
.stone-btn { width: 100%; padding: 15px 0; background-color: #a89f91; color: #3e2723; text-align: center; font-weight: bold; font-size: 18px; text-transform: uppercase; border: 2px solid #5d4037; border-radius: 8px; box-shadow: 3px 3px 0px #5d4037; cursor: pointer; }
.stone-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #5d4037; }
.row-btn { display: flex; gap: 10px; width: 100%; }

#back-btn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 10px 25px; background: #d32f2f; color: white; border-radius: 20px; border: 2px solid white; font-weight: bold; display: none; z-index: 2000; cursor: pointer; }
#custom-alert { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; border: 3px solid #8B4513; color: #8B4513; font-weight: bold; z-index: 10002; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
#weather-alert { display: none; position: fixed; top: 30%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 15px 30px; border-radius: 20px; font-weight: bold; font-size: 20px; z-index: 2001; }

.mindar-ui-overlay { display: none !important; }
.mindar-ui-loading { display: none !important; }
.mindar-ui-scanning { display: none !important; }
</style>
</head>

vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
gesture-detector>

<audio id="main-audio" src="./vanlang1.mp3" preload="none"></audio>

<a-asset-item id="m-vanlang6" src="./vanlang6.glb"></a-asset-item>
<a-asset-item id="m-vanlang7" src="./vanlang7.glb"></a-asset-item>
<a-asset-item id="m-vanlang8" src="./vanlang8.glb"></a-asset-item>

    <a-plane id="media-t0" rotation="0 0 0" position="0 0 0" height="2.2" width="1.6" visible="false" blue-chromakey="src: #main-video; color: 0 0.698 1.0; crop: 0.05"></a-plane>

    <a-entity id="model-t1" visible="false" gltf-model="#m-vanlang2" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity>
    <a-plane id="video-t1" visible="false" rotation="0 0 0" position="0 0 0" height="2" width="1.2" blue-chromakey="src: #main-video; color: 0.094 0 0.678"></a-plane>
</a-entity>

<a-entity id="t2" mindar-image-target="targetIndex: 2">
    <a-entity id="model-t2" visible="false" gltf-model="#m-vanlang3" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity>
    <a-plane id="video-t2" visible="false" rotation="0 0 0" position="0 0 0" height="2" width="1.2" blue-chromakey="src: #main-video; color: 0 1 0"></a-plane>
</a-entity>

<a-entity id="t3" mindar-image-target="targetIndex: 3"><a-entity id="model-t3" visible="false" gltf-model="#m-vanlang4" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity></a-entity>
<a-entity id="t4" mindar-image-target="targetIndex: 4"><a-entity id="model-t4" visible="false" gltf-model="#m-vanlang5" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity></a-entity>

<a-entity id="t5" mindar-image-target="targetIndex: 5">
    <a-entity id="model-t5" visible="false" gltf-model="#m-vanlang6" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity>
    <a-plane id="video-t5" visible="false" rotation="0 0 0" position="0 0 0" height="2" width="1.2" blue-chromakey="src: #main-video; color: 0 1 0"></a-plane>
</a-entity>

<a-entity id="t6" mindar-image-target="targetIndex: 6"><a-entity id="model-t6" visible="false" gltf-model="#m-vanlang7" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity></a-entity>
<a-entity id="t7" mindar-image-target="targetIndex: 7"><a-entity id="model-t7" visible="false" gltf-model="#m-vanlang8" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity></a-entity>
<a-entity id="t8" mindar-image-target="targetIndex: 8"><a-entity id="model-t8" visible="false" gltf-model="#m-vanlang9" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity></a-entity>
<a-entity id="t9" mindar-image-target="targetIndex: 9"><a-entity id="model-t9" visible="false" gltf-model="#m-vanlang10" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity></a-entity>
<a-entity id="t10" mindar-image-target="targetIndex: 10"><a-entity id="model-t10" visible="false" gltf-model="#m-vanlang11" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity></a-entity>
<a-entity id="t11" mindar-image-target="targetIndex: 11"><a-entity id="model-t11" visible="false" gltf-model="#m-vanlang12" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity></a-entity>

<a-entity id="t12" mindar-image-target="targetIndex: 12">
    <a-plane id="media-t12" visible="false" rotation="0 0 0" position="0 0 0" height="2" width="1.2" blue-chromakey="src: #main-video; color: 0 1 0"></a-plane>
</a-entity>

<a-entity id="t13" mindar-image-target="targetIndex: 13">
    <a-image id="img-14" src="./vanlang14.png" visible="false" rotation="0 0 0" position="0 0 0" height="2" width="1.2" gesture-handler></a-image>
    <a-image id="img-14b" src="./vanlang14b.png" visible="false" rotation="0 0 0" position="0 0 0" height="2" width="1.2" gesture-handler></a-image>
</a-entity>

<a-entity id="t14" mindar-image-target="targetIndex: 14">
    <a-image id="img-15" src="./vanlang15.png" visible="false" rotation="0 0 0" position="0 0 0" height="2" width="1.2" gesture-handler></a-image>
    <a-entity id="model-15b" visible="false" gltf-model="#m-15b" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity>
    <a-entity id="model-15c" visible="false" gltf-model="#m-15c" rotation="90 0 0" scale="1 1 1" gesture-handler animation-mixer></a-entity>
</a-entity>

</a-scene>

<script>
const cardConfig = [
    { type: 'menu1', hasInfo: true, hasAudio: true },
    { type: 'toggle', vidId: 'vanlang2', hasInfo: true, hasAudio: true },
    { type: 'toggle', vidId: 'vanlang2', hasInfo: true, hasAudio: true },
    { type: 'model', hasInfo: true, hasAudio: true },
    { type: 'model', hasInfo: true, hasAudio: true },
    { type: 'toggle', vidId: 'vanlang6', hasInfo: true, hasAudio: true },
    { type: 'model', hasInfo: true, hasAudio: true },
    { type: 'model', hasInfo: true, hasAudio: true },
    { type: 'model', hasInfo: true, hasAudio: true },
    { type: 'model', hasInfo: true, hasAudio: true },
    { type: 'model', hasInfo: true, hasAudio: true },
    { type: 'model', hasInfo: true, hasAudio: true },
    { type: 'video', vidId: 'vanlang13', hasInfo: true, hasAudio: true },
    { type: 'menu14', hasInfo: true, hasAudio: true },
    { type: 'menu15', hasInfo: true, hasAudio: true }
];

const startScreen = document.getElementById('start-screen');
const infoBtn = document.getElementById('info-btn');
const audioBtn = document.getElementById('audio-btn');
const toggleBtn = document.getElementById('toggle-video-btn');
const backBtn = document.getElementById('back-btn');
const infoModal = document.getElementById('info-modal');
const customAlert = document.getElementById('custom-alert');
const weatherAlert = document.getElementById('weather-alert');

const mainVideo = document.getElementById('main-video');
const mainAudio = document.getElementById('main-audio');

let activeIdx = -1;
let isAudioPlaying = false;
let isVideoMode = false;
let currentInfoSrc = '';
let currentAudioSrc = '';

document.getElementById('start-btn').addEventListener('click', () => {
    startScreen.style.display = 'none';
    mainVideo.play().catch(()=>{});
    mainAudio.play().catch(()=>{});
});

function hideAllMenus() {
    document.getElementById('menu-vanlang1').style.display = 'none';
    document.getElementById('menu-vanlang14').style.display = 'none';
    document.getElementById('menu-vanlang15').style.display = 'none';
    weatherAlert.style.display = 'none';
    backBtn.style.display = 'none';
}

function resetAll() {
    mainVideo.pause();
    mainAudio.pause();
    
    infoBtn.style.display = 'none';
    audioBtn.style.display = 'none';
    toggleBtn.style.display = 'none';
    infoModal.style.display = 'none';
    customAlert.style.display = 'none';
    hideAllMenus();
    
    for(let j = 0; j < 15; j++) {
        let m = document.getElementById(`model-t${j}`);
        let v = document.getElementById(`video-t${j}`);
        let p = document.getElementById(`media-t${j}`);
        if(m) m.setAttribute('visible', 'false');
        if(v) v.setAttribute('visible', 'false');
        if(p) p.setAttribute('visible', 'false');
    }
    document.getElementById('img-14').setAttribute('visible', 'false');
    document.getElementById('img-14b').setAttribute('visible', 'false');
    document.getElementById('img-15').setAttribute('visible', 'false');
    document.getElementById('model-15b').setAttribute('visible', 'false');
    document.getElementById('model-15c').setAttribute('visible', 'false');

    isAudioPlaying = false;
    audioBtn.innerText = '🔊';
    isVideoMode = false;
}

for (let i = 0; i < 15; i++) {
    const entity = document.getElementById(`t${i}`);
    if (!entity) continue;

    entity.addEventListener('targetFound', () => {
        if (activeIdx !== i) resetAll();
        activeIdx = i;
        infoBtn.style.display = 'flex';
        audioBtn.style.display = 'flex';
        
        let conf = cardConfig[i];
        currentInfoSrc = `./ttvanlang${i + 1}.png`;
        currentAudioSrc = `./vanlang${i + 1}.mp3`;
        mainAudio.src = currentAudioSrc;

        if (conf.type === 'menu1') {
            document.getElementById('menu-vanlang1').style.display = 'flex';
        } else if (conf.type === 'menu14') {
            document.getElementById('menu-vanlang14').style.display = 'flex';
            document.getElementById('img-14').setAttribute('visible', 'true');
        } else if (conf.type === 'menu15') {
            document.getElementById('menu-vanlang15').style.display = 'flex';
            document.getElementById('img-15').setAttribute('visible', 'true');
            currentInfoSrc = `./ttvanlang15a.png`;
            currentAudioSrc = `./vanlang15a.mp3`;
            mainAudio.src = currentAudioSrc;
        } else if (conf.type === 'toggle') {
            toggleBtn.style.display = 'flex';
            toggleBtn.innerText = '🎬';
            isVideoMode = false;
            let m = document.getElementById(`model-t${i}`);
            if (m) m.setAttribute('visible', 'true');
        } else if (conf.type === 'video') {
            let p = document.getElementById(`media-t${i}`);
            if (p) p.setAttribute('visible', 'true');
            mainVideo.src = `./${conf.vidId}.mp4`;
            mainVideo.muted = isAudioPlaying;
            mainVideo.play().catch(()=>{});
        } else if (conf.type === 'model') {
            let m = document.getElementById(`model-t${i}`);
            if (m) m.setAttribute('visible', 'true');
        }
    });

    entity.addEventListener('targetLost', () => {
        if (activeIdx === i) {
            resetAll();
            activeIdx = -1;
        }
    });
}

window.selectVideoT1 = function(id) {
    hideAllMenus();
    backBtn.style.display = 'block';
    let p = document.getElementById('media-t0');
    if(p) p.setAttribute('visible', 'true');
    mainVideo.src = `./${id}.mp4`;
    mainVideo.muted = isAudioPlaying;
    mainVideo.play().catch(()=>{});
}

window.showWeather = function() {
    weatherAlert.style.display = 'block';
    setTimeout(() => { weatherAlert.style.display = 'none'; }, 3000);
}

window.showMinerals = function() {
    hideAllMenus();
    backBtn.style.display = 'block';
    document.getElementById('img-14').setAttribute('visible', 'false');
    document.getElementById('img-14b').setAttribute('visible', 'true');
}

window.selectCulture = function(type) {
    hideAllMenus();
    backBtn.style.display = 'block';
    document.getElementById('img-15').setAttribute('visible', 'false');
    
    if (type === 'phungnguyen') {
        document.getElementById('model-15b').setAttribute('visible', 'true');
        currentInfoSrc = `./ttvanlang15b.png`;
        currentAudioSrc = `./vanlang15b.mp3`;
    } else {
        document.getElementById('model-15c').setAttribute('visible', 'true');
        currentInfoSrc = `./ttvanlang15c.png`;
        currentAudioSrc = `./vanlang15c.mp3`;
    }
    
    mainAudio.src = currentAudioSrc;
    if (isAudioPlaying) {
        mainAudio.play().catch(()=>{});
    }
}

window.goBack = function() {
    backBtn.style.display = 'none';
    if (activeIdx === 0) {
        document.getElementById('media-t0').setAttribute('visible', 'false');
        mainVideo.pause();
        document.getElementById('menu-vanlang1').style.display = 'flex';
    } else if (activeIdx === 13) {
        document.getElementById('img-14b').setAttribute('visible', 'false');
        document.getElementById('img-14').setAttribute('visible', 'true');
        document.getElementById('menu-vanlang14').style.display = 'flex';
    } else if (activeIdx === 14) {
        document.getElementById('model-15b').setAttribute('visible', 'false');
        document.getElementById('model-15c').setAttribute('visible', 'false');
        document.getElementById('img-15').setAttribute('visible', 'true');
        document.getElementById('menu-vanlang15').style.display = 'flex';
        currentInfoSrc = `./ttvanlang15a.png`;
        currentAudioSrc = `./vanlang15a.mp3`;
        mainAudio.src = currentAudioSrc;
        if (isAudioPlaying) mainAudio.play().catch(()=>{});
    }
}

toggleBtn.addEventListener('click', () => {
    isVideoMode = !isVideoMode;
    const model = document.getElementById(`model-t${activeIdx}`);
    const plane = document.getElementById(`video-t${activeIdx}`);
    const conf = cardConfig[activeIdx];

    if (isVideoMode) {
        model.setAttribute('visible', 'false');
        plane.setAttribute('visible', 'true');
        toggleBtn.innerText = '🧊';
        mainVideo.src = `./${conf.vidId}.mp4`;
        mainVideo.muted = isAudioPlaying;
        mainVideo.play().catch(()=>{});
    } else {
        plane.setAttribute('visible', 'false');
        model.setAttribute('visible', 'true');
        toggleBtn.innerText = '🎬';
        mainVideo.pause();
    }
});

infoBtn.addEventListener('click', () => {
    if (activeIdx === -1) return;
    if (cardConfig[activeIdx].hasInfo) {
        document.getElementById('info-content').src = currentInfoSrc;
        infoModal.style.display = 'flex';
        mainVideo.pause();
        mainAudio.pause();
    } else {
        customAlert.style.display = 'block';
    }
});

audioBtn.addEventListener('click', () => {
    if (activeIdx === -1) return;
    if (cardConfig[activeIdx].hasAudio) {
        isAudioPlaying = !isAudioPlaying;
        audioBtn.innerText = isAudioPlaying ? '🎵' : '🔊';
        if (isAudioPlaying) {
            mainAudio.play().catch(()=>{});
            mainVideo.muted = true;
        } else {
            mainAudio.pause();
            mainVideo.muted = false;
        }
    } else {
        customAlert.style.display = 'block';
    }
});

infoModal.addEventListener('click', () => {
    infoModal.style.display = 'none';
    if (isAudioPlaying) mainAudio.play().catch(()=>{});
    if (cardConfig[activeIdx].type === 'video' || isVideoMode || (activeIdx === 0 && backBtn.style.display === 'block')) {
        mainVideo.play().catch(()=>{});
    }
});

customAlert.addEventListener('click', () => {
    customAlert.style.display = 'none';
});
</script>
</body>
</html>
